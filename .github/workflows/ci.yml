name: CI and publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest --no-audit
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run
      - name: Audit locked dependencies before publication
        run: node scripts/audit-dependencies.mjs
      - name: Retain dependency security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: artifacts/dependency-audit/
          if-no-files-found: ignore
      - name: Publish new package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if ! npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            npm publish --access public --provenance
          fi
